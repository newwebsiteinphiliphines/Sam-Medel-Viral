<style>
  :root {
    --bg: #0e0b0a; --card: #181818; --border: #4a2e17;
    --text: #f2f2f2; --muted: #9a9a9a;
    --orange1: #ff8c00; --orange2: #ff5a00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #251830 0%, var(--bg) 60%);
    color: var(--text);
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; position: relative; overflow-x: hidden;
  }
  /* lightning flicker */
  body::before {
    content: ""; position: fixed; inset: 0; background: #b9a6ff; opacity: 0;
    pointer-events: none; z-index: 1; animation: flash 11s infinite;
  }
  @keyframes flash {
    0%, 92%, 96%, 100% { opacity: 0; }
    93% { opacity: .13; } 94% { opacity: .02; } 95% { opacity: .1; }
  }
  /* moon */
  .moon {
    position: fixed; top: 70px; right: 22px; width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff7d6, #f3d98a 70%);
    box-shadow: 0 0 40px 8px rgba(255,232,150,.25); animation: moonGlow 4s ease-in-out infinite;
    z-index: 0; pointer-events: none;
  }
  @keyframes moonGlow { 50% { box-shadow: 0 0 60px 16px rgba(255,232,150,.4); } }

  header {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid #2a2a2a; background: rgba(10,10,10,.75);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: .95rem; }
  #logoBtn {
    width: 34px; height: 34px; border-radius: 9px; overflow: hidden; cursor: pointer;
    border: 2px solid #f5a623; background: #f5a623; display: grid; place-items: center;
    font-size: 18px; padding: 0; flex: none; animation: bob 3s ease-in-out infinite;
  }
  #logoBtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes bob { 50% { transform: translateY(-2px) rotate(-4deg); } }
  .pumpkin-title { display: inline-block; animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

  .menu-wrap { position: relative; }
  .menu {
    width: 38px; height: 38px; border-radius: 11px; border: 1px solid #333;
    background: rgba(255,255,255,.05); display: grid; place-items: center; cursor: pointer; color:#fff;
  }
  .menu span, .menu span::before, .menu span::after {
    display: block; width: 16px; height: 2px; background: #fff; border-radius: 2px; position: relative; content: "";
  }
  .menu span::before { position: absolute; top: -5px; }
  .menu span::after { position: absolute; top: 5px; }
  .dropdown {
    display: none; position: absolute; right: 0; top: 44px; min-width: 190px; z-index: 20;
    background: #1b1b1b; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  .dropdown.show { display: block; animation: pop .15s ease; }
  .dropdown button {
    display: block; width: 100%; text-align: left; background: none; border: 0; color: #ddd;
    padding: 11px 14px; font-size: .85rem; cursor: pointer; border-bottom: 1px solid #262626;
  }
  .dropdown button:last-child { border-bottom: 0; }
  .dropdown button:hover { background: #2a1d10; color: #ffa040; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } }

  /* floating decorations */
  .deco { position: fixed; pointer-events: none; z-index: 2; }
  .ghost { top: 90px; left: 10px; font-size: 1.8rem; animation: ghostFloat 6s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255,255,255,.5)); }
  @keyframes ghostFloat {
    0%,100% { transform: translate(0,0) rotate(-6deg); opacity: .9; }
    25% { transform: translate(30px,-14px) rotate(4deg); opacity: .5; }
    50% { transform: translate(10px,-26px) rotate(-3deg); opacity: .95; }
    75% { transform: translate(-6px,-10px) rotate(6deg); opacity: .6; }
  }
  .bat { font-size: 1.4rem; top: 100px; left: -40px; animation: batFly 9s linear infinite; }
  .bat.b2 { top: 160px; font-size: 1rem; animation-duration: 13s; animation-delay: 3s; }
  .bat.b3 { top: 60px; font-size: 1.2rem; animation-duration: 11s; animation-delay: 6s; }
  @keyframes batFly {
    0% { transform: translate(0,0) scaleX(1); }
    25% { transform: translate(28vw,-24px) scaleX(.8); }
    50% { transform: translate(55vw,18px) scaleX(1); }
    75% { transform: translate(80vw,-18px) scaleX(.8); }
    100% { transform: translate(115vw,10px) scaleX(1); }
  }
  .spider-wrap { position: fixed; top: 0; left: 62%; z-index: 3; pointer-events: none; animation: spiderDrop 5s ease-in-out infinite; transform-origin: top; }
  .spider-wrap::before { content: ""; display: block; width: 1px; height: 60px; background: #888; margin: 0 auto; }
  .spider-wrap span { display: block; font-size: 1.3rem; text-align: center; }
  @keyframes spiderDrop { 0%,100% { transform: translateY(-22px) rotate(-3deg); } 50% { transform: translateY(34px) rotate(3deg); } }

  .falling { position: fixed; top: -30px; z-index: 2; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .4; } }
  body.noanim .deco, body.noanim .falling, body.noanim .spider-wrap, body.noanim .moon { display: none; }

  main { position: relative; z-index: 4; max-width: 340px; margin: 0 auto; padding: 22px 14px 50px; }
  h1 {
    text-align: center; font-size: 1.6rem; font-weight: 800;
    background: linear-gradient(90deg, #c864d0, #ff4d88, #ff8c00, #c864d0);
    background-size: 300% 100%; animation: shimmer 5s linear infinite;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,80,140,.35));
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .sub { text-align: center; color: var(--muted); font-size: .85rem; margin: 6px 0 20px; }

  .card {
    position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px 16px; animation: cardGlow 3s ease-in-out infinite;
  }
  @keyframes cardGlow {
    0%,100% { box-shadow: 0 0 18px rgba(255,120,0,.08); border-color: #4a2e17; }
    50% { box-shadow: 0 0 34px rgba(255,120,0,.28); border-color: #8a4a12; }
  }
  .card .web { position: absolute; top: -10px; right: -6px; font-size: 1.5rem; animation: sway 4s ease-in-out infinite; transform-origin: top right; }
  @keyframes sway { 50% { transform: rotate(8deg); } }
  .card .pump { position: absolute; bottom: -14px; right: 10px; font-size: 1.5rem; animation: pumpGlow 1.8s ease-in-out infinite; }
  @keyframes pumpGlow {
    0%,100% { filter: drop-shadow(0 0 2px #ff8c00); transform: scale(1); }
    50% { filter: drop-shadow(0 0 14px #ffae00); transform: scale(1.12); }
  }

  .alert {
    display: none; border: 1px solid #6b2a20; background: #1a0f10; color: #ff4b3a;
    border-radius: 12px; padding: 12px 14px; font-size: .85rem; margin-bottom: 14px;
  }
  .alert.show { display: block; animation: shake .35s; }
  .alert.ok { color: #5dd67a; border-color: #1f5a30; background: #0f1a12; animation: pop .2s; }
  @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  label { font-weight: 600; font-size: .85rem; }
  .btn-small {
    background: #0e0e0e; border: 1px solid #3a3a3a; color: #aaa; border-radius: 9px;
    padding: 6px 10px; font-size: .75rem; font-weight: 600; cursor: pointer; transition: .15s;
  }
  .btn-small:hover { border-color: var(--orange1); color: #ffa040; }
  .input-wrap {
    display: flex; align-items: center; background: #0d0d0d; border: 1px solid #333;
    border-radius: 12px; padding: 6px 6px 6px 12px; transition: .2s;
  }
  .input-wrap input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff;
    font-family: "Courier New", monospace; font-size: .85rem;
  }
  .input-wrap input::placeholder { color: #666; }
  .input-wrap:focus-within { border-color: var(--orange1); box-shadow: 0 0 12px rgba(255,140,0,.3); }

  .go {
    width: 100%; margin-top: 16px; padding: 12px; border: 1px solid #ff9a2e; border-radius: 12px;
    background: linear-gradient(90deg, var(--orange1), var(--orange2)); background-size: 200% 100%;
    color: #fff; font-size: .9rem; font-weight: 700; cursor: pointer;
    animation: btnPulse 2s ease-in-out infinite; transition: background-position .4s;
  }
  .go:hover { background-position: 100% 0; }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 14px rgba(255,110,0,.3); }
    50% { box-shadow: 0 0 28px rgba(255,110,0,.65); }
  }
  .go:active { transform: scale(.98); }
  .foot { text-align: center; color: var(--muted); margin-top: 14px; font-size: .75rem; }
  .foot a { color: var(--muted); cursor: pointer; }

  #history { display: none; margin-top: 12px; border-top: 1px solid #2a2a2a; padding-top: 8px; max-height: 160px; overflow-y: auto; }
  #history.show { display: block; animation: pop .2s; }
  #history a {
    display: block; color: #ffa040; word-break: break-all; padding: 5px 0; font-size: .75rem;
    border-bottom: 1px dashed #2a2a2a; text-decoration: none;
  }
  #history .empty { color: var(--muted); font-size: .75rem; }
  #fileInput { display: none; }

  /* ---------- HUMAN VERIFICATION ---------- */
  #verify {
    position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
    background: rgba(5,3,8,.82); backdrop-filter: blur(4px); padding: 18px;
  }
  #verify.show { display: flex; animation: pop .2s; }
  .vbox {
    width: 100%; max-width: 320px; background: #181818; border: 1px solid #8a4a12; border-radius: 18px;
    padding: 18px 16px; box-shadow: 0 0 40px rgba(255,120,0,.3); position: relative; text-align: center;
  }
  .vbox h2 { font-size: 1.05rem; margin: 4px 0 4px; }
  .vbox p { color: var(--muted); font-size: .78rem; margin-bottom: 14px; }
  .vclose { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: #888; font-size: 1.1rem; cursor: pointer; }
  .check-row {
    display: flex; align-items: center; gap: 12px; background: #0d0d0d; border: 1px solid #333;
    border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; user-select: none;
  }
  .check-row .box {
    width: 24px; height: 24px; border: 2px solid #777; border-radius: 6px; display: grid; place-items: center;
    flex: none; transition: .2s; font-size: 16px; color: transparent;
  }
  .check-row.loading .box { border-color: var(--orange1); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  .check-row.done .box { background: #2fbf5b; border-color: #2fbf5b; color: #fff; }
  .check-row.done { cursor: default; border-color: #1f5a30; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check-row span.t { font-size: .9rem; }
  .vbrand { margin-top: 12px; font-size: .68rem; color: #666; }
  #challenge { display: none; margin-top: 12px; }
  #challenge.show { display: block; animation: pop .2s; }
  #challenge .q { font-size: .95rem; margin-bottom: 8px; }
  #challenge .q b { color: #ffa040; font-size: 1.1rem; }
  #challenge input {
    width: 100%; background: #0d0d0d; border: 1px solid #333; border-radius: 10px; color: #fff;
    padding: 10px; font-size: 1rem; text-align: center; outline: 0;
  }
  #challenge input:focus { border-color: var(--orange1); }
  #challenge .go { margin-top: 10px; }
  .vbox.shake { animation: shake .35s; }
</style>
</head>

  const PERMANENT_LINK = 'https://mega.nz/file/OsgBzBQL#3m5pXPE5Dkys4ph87reFGrHfXzPLToG7hw6a14EcQdo';
  const logoBtn = $('logoBtn'), fileInput = $('fileInput'), favicon = $('favicon');

  /* ---------- ICON ---------- */
  function setIcon(src) {
    logoBtn.innerHTML = '';
    const img = new Image();
    img.alt = 'icon';
    img.onerror = () => { logoBtn.textContent = '🧑'; };
    img.src = src;
    logoBtn.appendChild(img);
    favicon.href = src;
  }
  function loadIcon() {
    let saved = null;
    try { saved = localStorage.getItem('siteIcon'); } catch {}
    setIcon(saved || DEFAULT_ICON);
  }
  function pickIcon() { fileInput.click(); }
  logoBtn.addEventListener('click', pickIcon);
  $('mIcon').addEventListener('click', () => { closeMenu(); pickIcon(); });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const ctx = c.getContext('2d');
        const s = Math.min(im.width, im.height);
        ctx.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 128, 128);
        const data = c.toDataURL('image/png');
        try { localStorage.setItem('siteIcon', data); } catch {}
        setIcon(data);
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(f);
    fileInput.value = '';
  });
  loadIcon();

  /* ---------- MENU ---------- */
  const dropdown = $('dropdown');
  function closeMenu() { dropdown.classList.remove('show'); }
  $('menuBtn').addEventListener('click', e => { e.stopPropagation(); dropdown.classList.toggle('show'); });
  document.addEventListener('click', e => { if (!dropdown.contains(e.target)) closeMenu(); });

  function applyAnim(on) {
    document.body.classList.toggle('noanim', !on);
    $('mAnim').textContent = '✨ Animations: ' + (on ? 'ON' : 'OFF');
  }
  let animOn = true;
  try { animOn = localStorage.getItem('anim') !== 'off'; } catch {}
  applyAnim(animOn);
  $('mAnim').addEventListener('click', () => {
    animOn = !animOn;
    try { localStorage.setItem('anim', animOn ? 'on' : 'off'); } catch {}
    applyAnim(animOn); closeMenu();
  });
  $('mClear').addEventListener('click', () => {
    try { localStorage.removeItem('linkHistory'); } catch {}
    renderHistory(); closeMenu(); showAlert('history cleared', true);
  });

  /* ---------- LINKS ---------- */
  function showAlert(msg, ok = false) {
    alertBox.className = 'alert';
    void alertBox.offsetWidth;                 // restart animation
    alertBox.textContent = msg;
    alertBox.className = 'alert show' + (ok ? ' ok' : '');
  }
  function normalize(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { const u = new URL(v); return u.hostname.includes('.') ? u.href : null; } catch { return null; }
  }
  function getHistory() {
    try { return JSON.parse(localStorage.getItem('linkHistory') || '[]'); } catch { return []; }
  }
  function saveHistory(link) {
    try {
      const h = [link, ...getHistory().filter(x => x !== link)].slice(0, 20);
      localStorage.setItem('linkHistory', JSON.stringify(h));
    } catch {}
  }
  function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderHistory() {
    const h = getHistory();
    historyBox.innerHTML = h.length
      ? h.map(l => `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')
      : '<div class="empty">No history yet</div>';
  }

  function doOpen() {
    const link = normalize(PERMANENT_LINK);
    if (!link) return showAlert('invalid link');
    saveHistory(link);
    renderHistory();
    showAlert('opening link...', true);
    const a = document.createElement('a');
    a.href = link; a.target = '_blank'; a.rel = 'noopener noreferrer';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function openLink() { showVerify(); }
  $('openBtn').addEventListener('click', openLink);
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') openLink(); });

  $('historyBtn').addEventListener('click', () => {
    renderHistory(); historyBox.classList.toggle('show');
  });
  $('backBtn').addEventListener('click', () => {
    alertBox.className = 'alert';
    historyBox.classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });


  /* ---------- HUMAN VERIFICATION ---------- */
  const verifyEl = $('verify'), checkRow = $('checkRow'), challenge = $('challenge');
  let answer = 0, busy = false;
  function newQuestion() {
    const a = 2 + Math.floor(Math.random() * 9), b = 2 + Math.floor(Math.random() * 9);
    answer = a + b; $('qText').textContent = a + ' + ' + b; $('ans').value = '';
  }
  function resetVerify() {
    busy = false; checkRow.className = 'check-row'; $('chkText').textContent = "I'm not a robot";
    challenge.classList.remove('show'); newQuestion();
  }
  function showVerify() { resetVerify(); verifyEl.classList.add('show'); }
  function hideVerify() { verifyEl.classList.remove('show'); }
  checkRow.addEventListener('click', () => {
    if (busy || checkRow.classList.contains('done')) return;
    busy = true; checkRow.classList.add('loading'); $('chkText').textContent = 'Verifying...';
    setTimeout(() => {
      checkRow.className = 'check-row done'; $('chkText').textContent = 'Almost there';
      challenge.classList.add('show'); $('ans').focus();
    }, 1200);
  });
  function submitVerify() {
    if (parseInt($('ans').value, 10) === answer) {
      hideVerify(); doOpen();                       // runs inside the click → not blocked
    } else {
      const vb = $('vbox'); vb.classList.remove('shake'); void vb.offsetWidth; vb.classList.add('shake');
      newQuestion(); $('ans').focus();
    }
  }
  $('vBtn').addEventListener('click', submitVerify);
  $('ans').addEventListener('keydown', e => { if (e.key === 'Enter') submitVerify(); });
  $('vclose').addEventListener('click', hideVerify);
  verifyEl.addEventListener('click', e => { if (e.target === verifyEl) hideVerify(); });

  /* ---------- FALLING HALLOWEEN ---------- */
  const items = ['🎃','🍬','🍭','🍂','🦇','💀','🕸️','🍁'];
  function drop() {
    if (document.body.classList.contains('noanim') || document.hidden) return;
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 96 + 'vw';
    el.style.fontSize = (14 + Math.random() * 14) + 'px';
    const dur = 7 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.opacity = .55 + Math.random() * .4;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000);
  }
  setInterval(drop, 1100);
</script>
</body>
